<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Title: sets the page title shown in the browser tab -->
  <title>Complete Head Elements Demo</title>

  <!-- Meta charset: defines the character encoding of the document -->
  <meta charset="UTF-8">

  <!-- Meta description: used by search engines to describe the page -->
  <meta name="description" content="A demo page showing all important head elements.">

  <!-- Meta author: specifies the author of the document -->
  <meta name="author" content="Aditya Singh">

  <!-- Base: sets the base URL for all relative links on the page -->
  <base href="https://example.com/">

  <!-- Link: connects an external resource, here a favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Style: can hold internal CSS (left empty as per instructions) -->
  <style>
  </style>

  <!-- Script: can hold internal JavaScript (left empty as per instructions) -->
  <script>
  </script>
</head>
<body>

  <h1>Head Elements Demo</h1>
  <p>
    This page demonstrates the important elements that can appear inside
    the &lt;head&gt; section of an HTML document.
  </p>

</body>
</html>
