<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Long and Short Quotations</title>
</head>
<body>

  <h1>Quotations Example</h1>

  <!-- Long quotation using blockquote -->
  <blockquote>
    The only limit to our realization of tomorrow will be our doubts of
    today. We must move forward with strong and active faith.
  </blockquote>

  <!-- Short quotation using q, with an HTML entity included -->
  <p>
    As someone once said, <q>Knowledge &amp; wisdom go hand in hand.</q>
  </p>

</body>
</html>
