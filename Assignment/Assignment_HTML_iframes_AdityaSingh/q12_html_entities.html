<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Entities Example</title>
</head>
<body>

  <h1>HTML Entities Demo</h1>

  <!-- Displaying special characters and symbols using HTML entities -->
  <p>
    Less than: &lt; &nbsp; Greater than: &gt; &nbsp; Ampersand: &amp; &nbsp;
    Double Quote: &quot; &nbsp; Single Quote: &#39;
  </p>

  <p>
    Copyright: &copy; &nbsp; Trademark: &trade; &nbsp; Registered: &reg;
  </p>

</body>
</html>
