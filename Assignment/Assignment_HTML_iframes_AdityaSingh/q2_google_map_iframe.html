<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embedded Google Map</title>
</head>
<body>

  <h1>My City - Mathura</h1>

  <!--
    The "loading" attribute set to "lazy" tells the browser to delay
    loading the iframe's content (the map) until the user scrolls near
    it, which improves the page's initial loading speed.
  -->
  <iframe
    title="Google Map showing Mathura"
    width="600"
    height="450"
    loading="lazy"
    src="https://www.google.com/maps?q=Mathura,Uttar%20Pradesh&output=embed">
  </iframe>

</body>
</html>
