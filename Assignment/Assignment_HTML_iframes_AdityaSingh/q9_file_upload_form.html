<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload Form</title>
</head>
<body>

  <h1>Upload Your Profile Picture</h1>

  <form action="#" method="post">
    <!-- accept attribute restricts the file picker to jpg and png files -->
    <label for="profile_pic">Choose a file:</label>
    <input type="file" id="profile_pic" name="profile_pic" accept=".jpg, .png">
    <br><br>
    <input type="submit" value="Upload">
  </form>

  <p>Only .jpg and .png image files are allowed for upload.</p>

</body>
</html>
