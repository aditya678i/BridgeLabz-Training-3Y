<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URI Encoding Demo</title>
</head>
<body>

  <h1>URI Encoding Example</h1>

  <p>
    Original URL: https://example.com/search?query=HTML & CSS
  </p>

  <!-- Spaces are encoded as %20 in a properly encoded URL -->
  <p>
    Correctly Encoded Link:
    <a href="https://example.com/search?query=HTML%20%26%20CSS">
      https://example.com/search?query=HTML%20%26%20CSS
    </a>
  </p>

</body>
</html>
