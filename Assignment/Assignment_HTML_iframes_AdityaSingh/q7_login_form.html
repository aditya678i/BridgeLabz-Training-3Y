<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form</title>
</head>
<body>

  <h1>Login</h1>

  <form action="#" method="post">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><br><br>

    <!--
      A CSRF (Cross-Site Request Forgery) token is a hidden, unique value
      generated by the server for each session/form. It ensures that a
      form submission genuinely came from the site's own page and not
      from a malicious external site, protecting the user's account.
    -->
    <input type="hidden" name="csrf_token" value="a1b2c3d4e5f6dummy">

    <input type="submit" value="Login">
  </form>

</body>
</html>
