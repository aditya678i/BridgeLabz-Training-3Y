<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">
    <header class="dash-header">
      <h1>Sales Dashboard</h1>
    </header>

    <aside class="sidebar">
      <nav>
        <a href="#">Overview</a>
        <a href="#">Orders</a>
        <a href="#">Customers</a>
        <a href="#">Products</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <main class="content">
      <section class="box wide">
        <h2>Revenue This Month</h2>
        <p class="stat">&#8377;4,82,300</p>
      </section>

      <section class="box">
        <h2>New Orders</h2>
        <p class="stat">218</p>
      </section>

      <section class="box">
        <h2>Returning Customers</h2>
        <p class="stat">64%</p>
      </section>

      <section class="box">
        <h2>Items Out of Stock</h2>
        <p class="stat">7</p>
      </section>
    </main>
  </div>

</body>
</html>
