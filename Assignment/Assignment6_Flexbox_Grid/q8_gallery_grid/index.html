<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">Travel Gallery</h1>

  <main class="gallery">
    <figure class="item">
      <div class="frame"><img src="https://placehold.co/500x400?text=Mountains" alt="Mountain range"></div>
      <figcaption>Himalayan foothills at sunrise</figcaption>
    </figure>
    <figure class="item">
      <div class="frame"><img src="https://placehold.co/500x400?text=Coast" alt="Coastline"></div>
      <figcaption>Konkan coastline after the rain</figcaption>
    </figure>
    <figure class="item">
      <div class="frame"><img src="https://placehold.co/500x400?text=Desert" alt="Desert dunes"></div>
      <figcaption>Dunes outside Jaisalmer</figcaption>
    </figure>
    <figure class="item">
      <div class="frame"><img src="https://placehold.co/500x400?text=Backwaters" alt="Backwaters"></div>
      <figcaption>Backwaters near Alleppey</figcaption>
    </figure>
    <figure class="item">
      <div class="frame"><img src="https://placehold.co/500x400?text=Old+City" alt="Old city street"></div>
      <figcaption>Narrow lanes of the old city</figcaption>
    </figure>
    <figure class="item">
      <div class="frame"><img src="https://placehold.co/500x400?text=Tea+Hills" alt="Tea plantation"></div>
      <figcaption>Tea terraces in Munnar</figcaption>
    </figure>
  </main>

</body>
</html>
