<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stage">
    <div class="card">
      <div class="card-inner">

        <div class="card-face card-front">
          <img src="https://placehold.co/260x160?text=Saturn" alt="Illustration of Saturn">
          <h2>Saturn</h2>
        </div>

        <div class="card-face card-back">
          <h2>About Saturn</h2>
          <p>The sixth planet from the Sun, made mostly of hydrogen and helium.
          Its ring system spans roughly 280,000 km but is only about ten metres
          thick in most places.</p>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
