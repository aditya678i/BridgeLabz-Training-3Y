<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Showcase</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">Showcase</h1>

  <main class="showcase-grid">
    <figure class="item">
      <div class="frame">
        <img src="https://placehold.co/400x300?text=Peaks" alt="Mountain peaks">
        <div class="overlay"></div>
      </div>
      <figcaption>Peaks at first light</figcaption>
    </figure>
    <figure class="item">
      <div class="frame">
        <img src="https://placehold.co/400x300?text=River" alt="River">
        <div class="overlay"></div>
      </div>
      <figcaption>River bend, monsoon season</figcaption>
    </figure>
    <figure class="item">
      <div class="frame">
        <img src="https://placehold.co/400x300?text=Market" alt="Street market">
        <div class="overlay"></div>
      </div>
      <figcaption>Morning market</figcaption>
    </figure>
    <figure class="item">
      <div class="frame">
        <img src="https://placehold.co/400x300?text=Temple" alt="Temple">
        <div class="overlay"></div>
      </div>
      <figcaption>Temple courtyard</figcaption>
    </figure>
    <figure class="item">
      <div class="frame">
        <img src="https://placehold.co/400x300?text=Fields" alt="Fields">
        <div class="overlay"></div>
      </div>
      <figcaption>Fields after harvest</figcaption>
    </figure>
    <figure class="item">
      <div class="frame">
        <img src="https://placehold.co/400x300?text=Skyline" alt="City skyline">
        <div class="overlay"></div>
      </div>
      <figcaption>Skyline at dusk</figcaption>
    </figure>
  </main>

</body>
</html>
