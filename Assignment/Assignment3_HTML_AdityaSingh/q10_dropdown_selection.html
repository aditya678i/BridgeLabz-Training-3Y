<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dropdown Selection Page</title>
</head>
<body>

  <h1>Select Your Travel Preferences</h1>

  <!-- Country dropdown -->
  <label for="country">Country:</label>
  <select id="country" name="country">
    <option value="india" selected>India</option>
    <option value="usa">USA</option>
    <option value="uk">UK</option>
  </select><br><br>

  <!-- State dropdown -->
  <label for="state">State:</label>
  <select id="state" name="state">
    <option value="up" selected>Uttar Pradesh</option>
    <option value="rajasthan">Rajasthan</option>
    <option value="goa">Goa</option>
  </select><br><br>

  <!-- City dropdown -->
  <label for="city">City:</label>
  <select id="city" name="city">
    <option value="mathura" selected>Mathura</option>
    <option value="agra">Agra</option>
    <option value="lucknow">Lucknow</option>
  </select><br><br>

  <!-- Favorite Tourist Place dropdown -->
  <label for="place">Favorite Tourist Place:</label>
  <select id="place" name="place">
    <option value="tajmahal" selected>Taj Mahal</option>
    <option value="redfort">Red Fort</option>
    <option value="qutubminar">Qutub Minar</option>
  </select>

  <!-- Summary paragraph -->
  <p>
    You selected India, Uttar Pradesh, Mathura, and your favorite tourist
    place is the Taj Mahal.
  </p>

</body>
</html>
