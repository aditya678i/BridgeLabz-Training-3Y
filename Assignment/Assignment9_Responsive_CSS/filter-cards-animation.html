<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Cards with Animation</title>
<link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>

  <h1 class="page-title">Team Profiles</h1>

  <main class="profile-row">
    <section class="profile-card">
      <img src="https://placehold.co/200x200?text=Riya" alt="Riya Kapoor">
      <h2>Riya Kapoor</h2>
      <p>Team Lead</p>
    </section>

    <section class="profile-card">
      <img src="https://placehold.co/200x200?text=Aman" alt="Aman Verma">
      <h2>Aman Verma</h2>
      <p>Frontend Developer</p>
    </section>

    <section class="profile-card">
      <img src="https://placehold.co/200x200?text=Sana" alt="Sana Iyer">
      <h2>Sana Iyer</h2>
      <p>Backend Developer</p>
    </section>
  </main>

</body>
</html>
