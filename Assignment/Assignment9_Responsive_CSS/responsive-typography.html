<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Typography</title>
<link rel="stylesheet" href="responsive-typography.css">
</head>
<body>

  <main class="type-section">
    <h1>Text That Scales With the Screen</h1>
    <p>This heading and paragraph use the <code>clamp()</code> function so
    their font size grows and shrinks smoothly with the viewport width,
    instead of jumping abruptly at fixed breakpoints. Try resizing the
    browser window to see the effect happen in real time.</p>
  </main>

</body>
</html>
