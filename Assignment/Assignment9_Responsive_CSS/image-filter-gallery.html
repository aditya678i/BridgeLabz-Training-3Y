<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Filter Gallery</title>
<link rel="stylesheet" href="image-filter-gallery.css">
</head>
<body>

  <h1 class="page-title">Filter Gallery</h1>

  <main class="filter-gallery">
    <figure class="photo blur">
      <img src="https://placehold.co/400x300?text=Blur" alt="Blurred photo">
      <figcaption>blur(4px)</figcaption>
    </figure>
    <figure class="photo grayscale">
      <img src="https://placehold.co/400x300?text=Grayscale" alt="Grayscale photo">
      <figcaption>grayscale(100%)</figcaption>
    </figure>
    <figure class="photo sepia">
      <img src="https://placehold.co/400x300?text=Sepia" alt="Sepia photo">
      <figcaption>sepia(80%)</figcaption>
    </figure>
    <figure class="photo brightness">
      <img src="https://placehold.co/400x300?text=Brightness" alt="Brightened photo">
      <figcaption>brightness(1.5)</figcaption>
    </figure>
    <figure class="photo contrast">
      <img src="https://placehold.co/400x300?text=Contrast" alt="High contrast photo">
      <figcaption>contrast(1.8)</figcaption>
    </figure>
    <figure class="photo hue-rotate">
      <img src="https://placehold.co/400x300?text=Hue+Rotate" alt="Hue rotated photo">
      <figcaption>hue-rotate(120deg)</figcaption>
    </figure>
  </main>

</body>
</html>
