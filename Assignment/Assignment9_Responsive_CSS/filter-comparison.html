<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="filter-comparison.css">
</head>
<body>

  <h1 class="page-title">Before &amp; After</h1>

  <main class="compare-row">

    </figure>
  </main>
