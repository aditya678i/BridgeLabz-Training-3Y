<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Cards</title>
<link rel="stylesheet" href="responsive-cards-mediaqueries.css">
</head>
<body>

  <h1 class="page-title">Responsive Card Grid</h1>

  <main class="card-row">
    <section class="card">
      <h2>Card One</h2>
      <p>Resize the browser to see the layout adapt.</p>
    </section>
    <section class="card">
      <h2>Card Two</h2>
      <p>Four columns on desktop, two on tablet, one on mobile.</p>
    </section>
    <section class="card">
      <h2>Card Three</h2>
      <p>Hover any card to see its background color change.</p>
    </section>
    <section class="card">
      <h2>Card Four</h2>
      <p>Equal spacing and padding across all breakpoints.</p>
    </section>
  </main>

</body>
</html>
