<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">Gallery</h1>

  <main class="gallery">
    <figure class="photo">
      <img src="https://placehold.co/400x300?text=Mountains" alt="Mountains">
      <figcaption>Mountains at dawn</figcaption>
    </figure>
    <figure class="photo">
      <img src="https://placehold.co/400x300?text=Lake" alt="Lake">
      <figcaption>Still lake water</figcaption>
    </figure>
    <figure class="photo">
      <img src="https://placehold.co/400x300?text=Forest" alt="Forest">
      <figcaption>Quiet forest trail</figcaption>
    </figure>
    <figure class="photo">
      <img src="https://placehold.co/400x300?text=Desert" alt="Desert">
      <figcaption>Golden sand dunes</figcaption>
    </figure>
    <figure class="photo">
      <img src="https://placehold.co/400x300?text=Ocean" alt="Ocean">
      <figcaption>Ocean at sunset</figcaption>
    </figure>
    <figure class="photo">
      <img src="https://placehold.co/400x300?text=City" alt="City">
      <figcaption>City skyline at night</figcaption>
    </figure>
  </main>

</body>
</html>
