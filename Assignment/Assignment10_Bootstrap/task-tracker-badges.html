<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="task-tracker-badges.css">
</head>
<body class="bg-light">

  <header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">My Tasks</h1>
      <!-- Badge counter showing total pending tasks -->
      <span class="badge bg-warning text-dark">4 Pending</span>
    </div>
  </header>

  <main class="container py-5">
    <ul class="list-group shadow-sm">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Fix login page validation bug
        <span class="badge bg-danger rounded-pill">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Update API documentation
        <span class="badge bg-warning text-dark rounded-pill">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Review pull request #142
        <span class="badge bg-danger rounded-pill">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Clean up unused CSS classes
        <span class="badge bg-success rounded-pill">Low</span>
      </li>
    </ul>

    <div class="text-center mt-4">
      <!-- Button with embedded badge -->
      <button class="btn btn-outline-success" type="button">
        Completed <span class="badge bg-success ms-1">12</span>
      </button>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 Task Tracker</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
