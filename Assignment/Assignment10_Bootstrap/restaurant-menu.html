<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Menu — The Copper Kettle</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="restaurant-menu.css">
</head>
<body>

  <header class="bg-dark text-white text-center py-4">
    <h1>The Copper Kettle</h1>
    <p class="lead text-light mb-0">Today's Menu</p>
  </header>

  <main class="container py-5">

    <figure class="text-center mb-5">
      <img src="https://placehold.co/500x300?text=Signature+Dish" class="img-fluid rounded" alt="Signature dish of the day">
      <figcaption class="text-muted mt-2">Our signature dish — slow-cooked lamb curry</figcaption>
    </figure>

    <h2 class="text-center lead mb-3">Menu</h2>

    <!-- Bootstrap table for menu items -->
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Item</th>
          <th>Category</th>
          <th class="text-end">Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Paneer Tikka</td>
          <td>Starter</td>
          <td class="text-end">&#8377;249</td>
        </tr>
        <tr>
          <td>Lamb Curry</td>
          <td>Main Course</td>
          <td class="text-end">&#8377;399</td>
        </tr>
        <tr>
          <td>Dal Makhani</td>
          <td>Main Course</td>
          <td class="text-end">&#8377;229</td>
        </tr>
        <tr>
          <td>Gulab Jamun</td>
          <td>Dessert</td>
          <td class="text-end">&#8377;99</td>
        </tr>
      </tbody>
    </table>

    <h2 class="text-center lead mt-5 mb-3">Chef's Specials</h2>

    <!-- List group for special items -->
    <ul class="list-group mx-auto" style="max-width: 500px;">
      <li class="list-group-item d-flex justify-content-between">
        Butter Chicken <span class="fw-bold">&#8377;349</span>
      </li>
      <li class="list-group-item d-flex justify-content-between">
        Saffron Biryani <span class="fw-bold">&#8377;429</span>
      </li>
      <li class="list-group-item d-flex justify-content-between">
        Tandoori Platter <span class="fw-bold">&#8377;499</span>
      </li>
    </ul>

  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 The Copper Kettle Restaurant</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
