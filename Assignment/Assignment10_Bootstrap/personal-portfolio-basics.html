<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Singh — Portfolio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="personal-portfolio-basics.css">
</head>
<body class="bg-light text-dark">

  <!-- p-5 / text-center / bg-light: Bootstrap spacing, text, background utilities -->
  <header class="text-center p-5 bg-light">
    <img src="https://placehold.co/140x140?text=A" alt="Profile photo of Aditya Singh"
         class="img-fluid rounded-circle mb-3">
    <h1 class="fw-bold">Aditya Singh</h1>
    <p class="lead">Cybersecurity &amp; UI/UX &middot; B.Tech CSE, GLA University</p>

    <div class="mt-4">
      <a href="#contact" class="btn btn-primary mb-3">Hire Me</a>
      <a href="#" class="btn btn-outline-dark mb-3">Download CV</a>
    </div>
  </header>

  <main class="container">
    <section class="mt-4 mb-3">
      <h2 class="text-center fw-bold">About</h2>
      <p class="text-center">
        I build secure, usable web interfaces and I'm currently completing a
        space-education internship with BSERC alongside my coursework.
      </p>
    </section>

    <!-- Contact form using .form-control -->
    <section id="contact" class="mt-4 mb-5">
      <h2 class="text-center fw-bold mb-3">Get in Touch</h2>
      <form class="mx-auto" style="max-width: 480px;">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" placeholder="Your name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="4" placeholder="Write your message..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 Aditya Singh</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
