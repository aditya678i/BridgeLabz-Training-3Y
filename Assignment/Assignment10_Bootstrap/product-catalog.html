<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Catalog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="product-catalog.css">
</head>
<body class="bg-light">

  <header class="bg-dark text-white text-center py-4">
    <h1>Our Products</h1>
  </header>

  <main class="container py-5">
    <!-- .row + .col-6/.col-md-3: 1 col mobile, 2 col tablet, 4 col desktop -->
    <div class="row g-4">

      <div class="col-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://placehold.co/300x220?text=Mouse" class="card-img-top" alt="Wireless mouse">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Mouse</h5>
            <p class="card-text fw-bold">&#8377;1,299</p>
            <a href="#" class="btn btn-primary btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://placehold.co/300x220?text=Keyboard" class="card-img-top" alt="Mechanical keyboard">
          <div class="card-body text-center">
            <h5 class="card-title">Mechanical Keyboard</h5>
            <p class="card-text fw-bold">&#8377;4,599</p>
            <a href="#" class="btn btn-primary btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://placehold.co/300x220?text=Monitor" class="card-img-top" alt="27 inch monitor">
          <div class="card-body text-center">
            <h5 class="card-title">27" Monitor</h5>
            <p class="card-text fw-bold">&#8377;18,999</p>
            <a href="#" class="btn btn-primary btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://placehold.co/300x220?text=Headphones" class="card-img-top" alt="Noise cancelling headphones">
          <div class="card-body text-center">
            <h5 class="card-title">NC Headphones</h5>
            <p class="card-text fw-bold">&#8377;8,499</p>
            <a href="#" class="btn btn-primary btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 The Product Catalog</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
