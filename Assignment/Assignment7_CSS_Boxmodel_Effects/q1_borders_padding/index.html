<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borders &amp; Padding</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">Borders &amp; Padding</h1>

  <main class="box-row">
    <div class="box solid">
      <p>solid, 8px padding</p>
    </div>
    <div class="box dashed">
      <p>dashed, 16px padding</p>
    </div>
    <div class="box double">
      <p>double, 24px padding</p>
    </div>
    <div class="box groove">
      <p>groove, rounded corners</p>
    </div>
  </main>

</body>
</html>
