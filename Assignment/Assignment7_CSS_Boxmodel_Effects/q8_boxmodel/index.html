<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Model Exploration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">The CSS Box Model</h1>

  <main class="demo-row">

    <div class="demo">
      <h2>content-box (default)</h2>
      <div class="margin-layer">
        margin
        <div class="border-layer">
          border
          <div class="padding-layer">
            padding
            <div class="content-layer">content</div>
          </div>
        </div>
      </div>
      <p>Width here is content-only; padding and border add to the total size.</p>
    </div>

    <div class="demo">
      <h2>box-sizing: border-box</h2>
      <div class="margin-layer">
        margin
        <div class="border-layer border-box-demo">
          border
          <div class="padding-layer">
            padding
            <div class="content-layer">content</div>
          </div>
        </div>
      </div>
      <p>Width here includes padding and border, so total size stays fixed.</p>
    </div>

  </main>

</body>
</html>
