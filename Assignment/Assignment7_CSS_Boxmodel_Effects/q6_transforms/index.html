<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformations Showcase</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">Hover Each Box</h1>

  <main class="transform-row">
    <div class="item">
      <div class="box rotate-box"></div>
      <p>rotate(45deg)</p>
    </div>
    <div class="item">
      <div class="box scale-box"></div>
      <p>scale(1.3)</p>
    </div>
    <div class="item">
      <div class="box translate-box"></div>
      <p>translate(0, -20px)</p>
    </div>
    <div class="item">
      <div class="box skew-box"></div>
      <p>skew(15deg, 5deg)</p>
    </div>
  </main>

</body>
</html>
