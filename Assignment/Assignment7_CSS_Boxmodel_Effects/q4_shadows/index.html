<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadows &amp; Depth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">Shadows &amp; Depth</h1>

  <main class="card-row">
    <section class="card soft-shadow">
      <h2>Soft Shadow</h2>
      <p>A gentle, low-spread shadow that suggests the card sits just above the page.</p>
    </section>

    <section class="card sharp-shadow">
      <h2>Sharp Shadow</h2>
      <p>A tighter, more solid shadow that gives a crisper sense of edge.</p>
    </section>

    <section class="card layered-shadow">
      <h2>Layered Shadow</h2>
      <p>Two shadows stacked together to imitate a more realistic, diffused light source.</p>
    </section>
  </main>

</body>
</html>
