<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Height &amp; Width Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stage">
    <div class="box box-px">
      <p>width: 200px<br>height: 200px</p>
    </div>

    <div class="box box-percent">
      <p>width: 50%<br>max-width: 300px<br>min-height: 150px</p>
    </div>

    <div class="box box-vh-em">
      <p>height: 30vh<br>padding: 2em<br>overflow: auto — extra text scrolls inside this box instead of stretching it, extra text scrolls inside this box instead of stretching it.</p>
    </div>
  </main>

</body>
</html>
