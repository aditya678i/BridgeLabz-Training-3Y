<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outline &amp; Focus Styling</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="form-wrapper">
    <form class="demo-form">
      <h1>Quick Feedback</h1>

      <label for="name">Name</label>
      <input type="text" id="name" class="outline-solid" placeholder="Your name">

      <label for="email">Email</label>
      <input type="email" id="email" class="outline-dashed" placeholder="you@example.com">

      <label for="topic">Topic</label>
      <input type="text" id="topic" class="outline-dotted" placeholder="What is this about?">

      <label for="message">Message</label>
      <textarea id="message" class="outline-double" rows="4" placeholder="Write your feedback..."></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>

</body>
</html>
