<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Creative Inline Formatting Example</title>
</head>
<body>
  <!-- Creative paragraph combining multiple inline elements -->
  <p>
    Welcome to my <strong>web development journey</strong>!<br>
    I believe in learning by <em>doing</em>, not just reading.<br>
    My <mark>current focus</mark> is mastering HTML, CSS, and JavaScript.
    <small>Last updated: 2026</small>
  </p>
</body>
</html>
