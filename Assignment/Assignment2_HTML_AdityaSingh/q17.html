<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Article Example</title>
</head>
<body>
  <main>
    <!-- Article with a blog-style heading and paragraph -->
    <article>
      <h2>My First Blog</h2>
      <p>
        Today I started learning semantic HTML tags like header, nav, main,
        section, article, aside, and footer. They make a webpage much more
        organized and meaningful compared to using plain divs everywhere.
      </p>
    </article>
  </main>
</body>
</html>
