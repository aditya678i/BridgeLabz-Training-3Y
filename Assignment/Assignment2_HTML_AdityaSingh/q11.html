<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Span Elements Example</title>
</head>
<body>
  <!-- Paragraph with three span elements labeling different parts -->
  <p>
    My favorite subjects are
    <span title="Core subject">Cybersecurity</span>,
    <span title="Elective subject">Web Development</span>, and
    <span title="Interest area">Artificial Intelligence</span>.
  </p>
</body>
</html>
